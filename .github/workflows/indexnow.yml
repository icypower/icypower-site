# Tells Bing / Yandex / Seznam / Naver (and, through Bing, ChatGPT search and Copilot)
# about every page in sitemap.xml after each deploy to main. Free, no account needed:
# ownership is proven by the key file at the site root.
name: IndexNow ping
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Cloudflare Pages to finish deploying
        run: sleep 150
      - name: Submit sitemap URLs
        run: |
          KEY=$(basename $(ls ????????????????????????????????.txt | head -1) .txt)
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | jq -R . | jq -s -c .)
          BODY=$(jq -n -c --arg k "$KEY" --argjson u "$URLS" \
            '{host:"icypower.pages.dev", key:$k, keyLocation:("https://icypower.pages.dev/"+$k+".txt"), urlList:$u}')
          echo "$BODY"
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$BODY"
