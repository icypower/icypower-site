<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/png" href="assets/img/icy_power_Logo.png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>ההזמנה אושרה · Icy Power</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/styles.css" />
<style>
  .bks{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;
    background:linear-gradient(160deg,#0A2540 0%,#0B4F6C 55%,#0E6A86 100%);}
  .bks-card{background:#fff;max-width:440px;width:100%;border-radius:22px;padding:34px 26px;text-align:center;
    box-shadow:0 20px 60px -20px rgba(0,0,0,.5);}
  .bks-check{width:74px;height:74px;border-radius:50%;margin:0 auto 18px;
    background:linear-gradient(135deg,#2F9E6B,#37c07f);display:flex;align-items:center;justify-content:center;}
  .bks-check svg{width:38px;height:38px;}
  .bks-card h1{font-size:26px;margin:0 0 8px;color:#0A2540;}
  .bks-card p{color:#5A7184;font-size:15px;line-height:1.6;margin:0 0 6px;}
  .bks-next{margin:22px 0 6px;text-align:right;background:#EEF4F8;border-radius:14px;padding:16px 18px;}
  .bks-next h2{font-size:15px;margin:0 0 10px;color:#0A2540;}
  .bks-next li{list-style:none;display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:#3A4A5A;margin-bottom:8px;line-height:1.45;}
  .bks-next li svg{flex:0 0 auto;width:17px;height:17px;margin-top:2px;}
  .bks-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
</style>
</head>
<body>
<main class="bks">
  <div class="bks-card">
    <div class="bks-check" id="bksIcon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1 id="bksTitle">רגע, מאשרים…</h1>
    <p id="bksMsg1">בודקים את פרטי התשלום מול חברת הסליקה.</p>
    <p id="bksMsg2"></p>

    <div class="bks-next" id="bksNext" hidden>
      <h2>מה עכשיו?</h2>
      <ul style="margin:0;padding:0;">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="#0B4F6C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>שמרו את התאריך ביומן — נתראה בבוקר מלא אנרגיה.</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="#0B4F6C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15l2 2 4-4"/></svg>יישלח אליכם טופס בריאות קצר למילוי לפני הסדנה.</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="#0B4F6C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.2-7-11a7 7 0 0 1 14 0c0 5.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>קישור למיקום המדויק (Waze) יישלח יחד עם הפרטים.</li>
      </ul>
    </div>

    <div class="bks-actions">
      <a href="https://wa.me/972548787766" class="btn btn-wa btn-lg" target="_blank" rel="noopener">יש שאלה? דברו איתנו בוואטסאפ</a>
      <a href="booking.html" class="btn btn-ghost" id="bksBack">חזרה לאתר</a>
    </div>
  </div>
</main>
<script>
  // The J5 approval redirects here, but capture/release is decided server-side
  // afterwards — so read the REAL status instead of assuming success.
  (function () {
    var id = new URLSearchParams(location.search).get('b') || '';
    var iconOk = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    var iconInfo = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>';
    function set(icon, bg, title, m1, m2, showNext, back) {
      var i = document.getElementById('bksIcon');
      i.innerHTML = icon; if (bg) i.style.background = bg;
      document.getElementById('bksTitle').textContent = title;
      document.getElementById('bksMsg1').textContent = m1;
      document.getElementById('bksMsg2').textContent = m2 || '';
      document.getElementById('bksNext').hidden = !showNext;
      if (back) document.getElementById('bksBack').textContent = back;
    }
    var tries = 0;
    function poll() {
      tries++;
      fetch('/api/booking-status?b=' + encodeURIComponent(id))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var s = d && d.status;
          if (s === 'confirmed') {
            set(iconOk, 'linear-gradient(135deg,#2F9E6B,#37c07f)', 'שמרנו לך מקום! 🎉',
                'התשלום התקבל וההזמנה שלך אושרה.', 'אישור וקבלה נשלחים אליך למייל ברגעים אלה.', true);
          } else if (s === 'voided') {
            set(iconInfo, 'linear-gradient(135deg,#C98A00,#E0A800)', 'המקום התמלא — לא חויבת',
                'בזמן האישור המקום האחרון נתפס, ולכן ביטלנו את החיוב — לא ירד ממך כסף.',
                'בחרו תאריך אחר בעמוד ההזמנות, ואנחנו כאן בוואטסאפ לכל שאלה.', false, 'לבחירת תאריך אחר');
          } else if (s === 'failed') {
            set(iconInfo, 'linear-gradient(135deg,#C0392B,#E05545)', 'התשלום לא הושלם',
                'החיוב לא אושר. לא ירד ממך כסף.', 'נסו שוב בעמוד ההזמנות, או דברו איתנו בוואטסאפ.', false, 'חזרה להזמנות');
          } else if ((s === 'pending' || s === 'authorized' || s === 'capturing' || s === 'voiding') && tries < 8) {
            setTimeout(poll, 1500);
          } else {
            // still not settled, or unknown -> reassure without a false promise.
            set(iconInfo, 'linear-gradient(135deg,#0B4F6C,#0E6A86)', 'קיבלנו את הבקשה',
                'אנחנו מסיימים לאמת את התשלום. אם יש חיוב, אישור יישלח למייל.',
                'לכל שאלה אנחנו בוואטסאפ.', false);
          }
        })
        .catch(function () {
          if (tries < 8) setTimeout(poll, 1500);
        });
    }
    if (!id) {
      set(iconOk, 'linear-gradient(135deg,#2F9E6B,#37c07f)', 'תודה!', 'אם יש חיוב, אישור יישלח למייל.', '', true);
    } else { poll(); }
  })();
</script>
</body>
</html>
